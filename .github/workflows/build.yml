name: Build prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.7.2
          BASE=https://github.com/godotengine/godot/releases/download/${VERSION}-stable
          curl -fsSL "$BASE/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fsSL "$BASE/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          curl -fsSL "$BASE/SHA512-SUMS.txt" -o /tmp/SHA512-SUMS.txt
          python3 - <<'PY'
          import hashlib,pathlib
          sums=pathlib.Path('/tmp/SHA512-SUMS.txt').read_text()
          for name in ['godot.zip','templates.tpz']:
              assert hashlib.sha512(pathlib.Path('/tmp/'+name).read_bytes()).hexdigest() in sums
          PY
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/${VERSION}.stable
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/${VERSION}.stable/
      - name: Import and test native gameplay
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . -- --smoke-test | tee /tmp/smoke.log
          grep -q 'SMOKE PASS' /tmp/smoke.log
      - name: Configure Android export
        shell: bash
        run: |
          sdkmanager "build-tools;36.1.0" "platforms;android-36"
          mkdir -p ~/.config/godot ~/.android builds/web
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build Android, Windows, Web
        shell: bash
        run: |
          godot --headless --path . --export-debug "Android APK" builds/cptycoon-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey builds/cptycoon-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify builds/cptycoon-debug.apk
          godot --headless --path . --export-release "Windows Desktop" builds/cptycoon.exe
          godot --headless --path . --export-release "Web" builds/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-builds
          path: builds/
          retention-days: 14
